name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy with Pulumi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm install

      - name: Bundle Worker with Wrangler
        id: bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist
          npx wrangler deploy --dry-run --outdir dist
        continue-on-error: true

      - name: Bundle Worker with esbuild (fallback)
        if: steps.bundle.outcome != 'success' || !hashFiles('dist/index.js')
        run: |
          npx esbuild src/index.ts --bundle --format=esm --platform=browser --outfile=dist/index.js --external:cloudflare:workers

      - name: Cache Pulumi state
        uses: actions/cache@v4
        with:
          path: ~/.pulumi
          key: pulumi-${{ runner.os }}-dev
          

      - name: Install Pulumi
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: "latest"

      - name: Install Pulumi dependencies
        run: |
          cd infra
          npm install

      - name: Export Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> $GITHUB_ENV    

      - name: Delete orphaned KV namespace if Pulumi state is empty
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi login --local
          pulumi stack init dev || pulumi stack select dev
          # Check if sessions-kv exists in Pulumi state
          if ! pulumi stack export 2>/dev/null | grep -q "sessions-kv"; then
            # Check if KV namespace exists in Cloudflare
            NAMESPACE_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[] | select(.title=="SESSIONS") | .id' 2>/dev/null || echo "")
            if [ -n "$NAMESPACE_ID" ]; then
              echo "Deleting orphaned KV namespace: $NAMESPACE_ID"
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NAMESPACE_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            fi
          fi          

      - name: Set Pulumi config
        working-directory: infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pulumi login --local
          pulumi stack init dev || pulumi stack select dev
          pulumi config set githubClientId ${{ secrets.GH_CLIENT_ID }} --secret
          pulumi config set githubClientSecret ${{ secrets.GH_CLIENT_SECRET }} --secret
          pulumi config set appBaseUrl ${{ secrets.APP_BASE_URL }}
          pulumi config set sessionSecret ${{ secrets.SESSION_SECRET }} --secret

      - name: Pulumi Preview
        working-directory: infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pulumi preview

      - name: Pulumi Up
        working-directory: infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pulumi up --yes
