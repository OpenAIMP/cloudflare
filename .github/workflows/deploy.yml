name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm install

      # --- Create or find KV namespace ---
      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Try to find existing SESSIONS namespace via API
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "SESSIONS namespace not found, creating..."
            KV_ID=$(npx wrangler kv namespace create SESSIONS 2>&1 | grep -oP 'id:\s*\K[a-f0-9]+' || echo "")
            if [ -z "$KV_ID" ]; then
              # Fallback: parse from JSON output
              KV_ID=$(npx wrangler kv namespace create SESSIONS --json 2>/dev/null | jq -r '.result.id' 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$KV_ID" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      # --- Update wrangler.jsonc with real KV ID ---
      - name: Update wrangler.jsonc with KV namespace ID
        run: |
          sed -i "s/<YOUR_KV_NAMESPACE_ID>/$KV_ID/" wrangler.jsonc
          cat wrangler.jsonc

      # --- Deploy Worker with assets ---
      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # --- Set secrets ---
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GH_CLIENT_ID }}" | npx wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.GH_CLIENT_SECRET }}" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "${{ secrets.APP_BASE_URL }}" | npx wrangler secret put APP_BASE_URL
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
