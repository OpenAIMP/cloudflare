<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Search Chat Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --user-bg: #1f6feb;
      --assistant-bg: #21262d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .header-left h1 { font-size: 1.1rem; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .user-info { display: flex; align-items: center; gap: 0.5rem; }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; }
    .user-info span { font-size: 0.9rem; color: var(--muted); }
    .logout-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .logout-btn:hover { color: var(--text); border-color: var(--muted); }
    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .message {
      max-width: 80%;
      padding: 0.875rem 1.25rem;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: white;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
    }
    .message.assistant .sources {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .message.assistant .sources summary {
      cursor: pointer;
      font-weight: 600;
    }
    .typing-indicator {
      align-self: flex-start;
      color: var(--muted);
      font-style: italic;
      padding: 0.5rem 1rem;
    }
    .typing-indicator span {
      animation: blink 1.5s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.3s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    /* Input area */
    #input-area {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #input-form {
      display: flex;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
    }
    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #message-input:focus { border-color: var(--accent); }
    #message-input:disabled { opacity: 0.5; }
    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #1f6feb; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Welcome */
    .welcome {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .welcome h2 { font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--text); }
    /* Scrollbar */
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>🤖 AI Search Chat Agent</h1>
    </div>
    <div class="header-right">
      <div class="user-info" id="user-info" style="display:none;">
        <img id="user-avatar" src="" alt="avatar" />
        <span id="user-name"></span>
      </div>
      <a href="/auth/logout" class="logout-btn" id="logout-btn" style="display:none;">Logout</a>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h2>Ask me anything</h2>
      <p>I'll search your AI Search instance and generate an answer.</p>
    </div>
  </div>

  <div id="input-area">
    <form id="input-form">
      <input type="text" id="message-input" placeholder="Type your question..." autocomplete="off" disabled />
      <button type="submit" id="send-btn" disabled>Send</button>
    </form>
  </div>

  <script>
    // --- User info from server injection ---
    const user = window.__USER__;
    if (user) {
      document.getElementById('user-info').style.display = 'flex';
      document.getElementById('user-avatar').src = user.avatar;
      document.getElementById('user-name').textContent = user.name || user.login;
      document.getElementById('logout-btn').style.display = 'inline-block';
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
    }

    // --- Chat logic ---
    const chatEl = document.getElementById('chat');
    const formEl = document.getElementById('input-form');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeEl = document.getElementById('welcome');

    const conversationHistory = [];

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      // Hide welcome
      if (welcomeEl) welcomeEl.style.display = 'none';

      // Add user message
      addMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      // Clear input
      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Typing indicator
      const typingEl = addTypingIndicator();

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory }),
        });

        typingEl.remove();

        if (!resp.ok) {
          const errText = await resp.text();
          addMessage('assistant', `⚠️ Error (${resp.status}): ${errText}`);
          return;
        }

        const data = await resp.json();
        const answer = data.response || data.choices?.[0]?.message?.content || JSON.stringify(data);
        addMessage('assistant', answer, data);
        conversationHistory.push({ role: 'assistant', content: answer });
      } catch (err) {
        typingEl.remove();
        addMessage('assistant', `⚠️ Network error: ${err.message}`);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    function addMessage(role, text, data) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;

      // If there are source chunks, show them
      if (data && data.chunks && data.chunks.length > 0) {
        const sources = document.createElement('details');
        sources.className = 'sources';
        sources.innerHTML = `<summary>📚 ${data.chunks.length} source(s)</summary>` +
          data.chunks.map((c, i) => `<div style="margin-top:0.4rem">[${i+1}] ${c.content?.substring(0, 200) || ''}...</div>`).join('');
        el.appendChild(sources);
      }

      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addTypingIndicator() {
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.innerHTML = 'Thinking<span>.</span><span>.</span><span>.</span>';
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
      return el;
    }
  </script>
</body>
</html>
